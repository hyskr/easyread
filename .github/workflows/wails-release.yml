name: Build Wails macOS
on:
  workflow_dispatch:
  push:
    tags: ['wails-v*']
    branches: ['main', 'feat/wails-desktop']
    paths: ['desktop-wails/**', 'backend/**', 'easyread/web/**', 'scripts/build_wails.sh', 'scripts/build_backend.cjs', 'scripts/bundle_poppler.cjs', '.github/workflows/wails-release.yml']
permissions:
  contents: write
jobs:
  macos:
    if: github.repository == 'hyskr/easyread'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: |
            desktop-wails/go.sum
            backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: brew install poppler
      - name: Test Go backend
        working-directory: backend
        run: go test ./...
      - name: Test native desktop helpers
        working-directory: desktop-wails
        run: CGO_LDFLAGS='-framework UniformTypeIdentifiers' go test ./...
      - name: Build and sign
        run: |
          if [[ "$GITHUB_REF_NAME" == wails-v* ]]; then export WAILS_VERSION="${GITHUB_REF_NAME#wails-v}"; fi
          ./scripts/build_wails.sh
        env:
          MAC_SIGN_P12: ${{ secrets.MAC_SIGN_P12 }}
          MAC_SIGN_P12_PASSWORD: ${{ secrets.MAC_SIGN_P12_PASSWORD }}
      - name: Native PDF and persistence smoke test
        run: EASYREAD_PDF_BIN="$PWD/build/backend/bin" node tests/backend/native-smoke.cjs
      - name: Package
        run: |
          mkdir -p release/staging
          ditto 'desktop-wails/build/bin/EasyRead Wails.app' 'release/staging/EasyRead Wails.app'
          ln -s /Applications release/staging/Applications
          hdiutil create -volname 'EasyRead Wails' -srcfolder release/staging -ov -format UDZO release/EasyRead-Wails-arm64.dmg
          ditto -c -k --sequesterRsrc --keepParent 'desktop-wails/build/bin/EasyRead Wails.app' release/EasyRead-Wails-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: EasyRead-Wails-macOS-arm64
          path: |
            release/*.dmg
            release/*.zip
      - name: Publish Wails release
        if: startsWith(github.ref, 'refs/tags/wails-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.dmg release/*.zip --title "EasyRead Wails ${GITHUB_REF_NAME#wails-v}" --notes "macOS Apple Silicon Wails desktop. 使用独立 easyread-wails:// 协议，保留现有 Electron 应用。"
